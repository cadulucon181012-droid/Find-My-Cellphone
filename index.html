<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Find My Phone - Acha Celular</title>
  <meta name="theme-color" content="#0f172a">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    body{background:#0f172a;color:#f8fafc;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px;gap:16px;transition:background .1s}
    body.flashing{background:#fff!important}
    header{text-align:center;max-width:420px} h1{font-size:1.8rem;font-weight:700;color:#38bdf8}
    .app-description{font-size:.88rem;color:#94a3b8;line-height:1.4;margin-top:8px}
    .instruction-card{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);border-radius:12px;padding:12px 14px;font-size:.85rem;color:#e0f2fe;text-align:center;width:100%;max-width:380px}
    .main-control{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:380px;margin:8px 0}
    .btn-toggle{width:160px;height:160px;border-radius:50%;border:4px solid #38bdf8;background:radial-gradient(circle,#1e293b 0%,#0f172a 100%);color:#38bdf8;font-size:1.15rem;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;box-shadow:0 0 25px rgba(56,189,248,.25);transition:all .3s}
    .btn-toggle.active{border-color:#ef4444;color:#f87171;background:radial-gradient(circle,#450a0a 0%,#1e1b4b 100%);box-shadow:0 0 35px rgba(239,68,68,.4);animation:pulse 1.8s infinite}
    @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
    .clap-counter-box{display:flex;align-items:center;gap:8px;font-size:1.1rem;font-weight:600;color:#f1f5f9;background:#1e293b;padding:8px 20px;border-radius:9999px;border:1px solid #334155}
    .clap-dots{display:flex;gap:6px}.clap-dot{width:12px;height:12px;border-radius:50%;background:#475569;transition:all .2s}.clap-dot.filled{background:#38bdf8;transform:scale(1.2)}
    .settings-card{width:100%;max-width:380px;background:#1e293b;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;border:1px solid #334155}
    .setting-row{display:flex;flex-direction:column;gap:6px}.setting-label{display:flex;justify-content:space-between;font-size:.85rem;color:#cbd5e1}
    input[type=range]{width:100%;accent-color:#38bdf8;cursor:pointer}
    .meter-container{background:#0f172a;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;border:1px solid #334155}
    .meter-header{display:flex;justify-content:space-between;font-size:.8rem;color:#94a3b8}
    .meter-bar-bg{width:100%;height:18px;background:#1e293b;border-radius:9px;overflow:hidden;position:relative}
    .meter-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444);transition:width .08s}
    .meter-threshold-line{position:absolute;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 4px #000}
    .actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    button.btn-action{background:#334155;color:#f1f5f9;border:1px solid #475569;border-radius:8px;padding:10px 8px;font-size:.82rem;font-weight:500;cursor:pointer}
