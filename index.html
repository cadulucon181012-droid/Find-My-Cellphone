<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find My Phone</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#0f172a;color:#fff;display:flex;flex-direction:column;align-items:center;padding:20px;gap:12px;min-height:100vh}
body.flash{background:#fff!important}
.circle{width:170px;height:170px;border-radius:50%;border:5px solid #38bdf8;background:#1e293b;color:#38bdf8;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;cursor:pointer}
.circle.on{border-color:#ef4444;color:#ef4444;animation:pulse 1s infinite}
@keyframes pulse{0%{scale:1}50%{scale:1.08}100%{scale:1}}
.card{width:100%;max-width:380px;background:#1e293b;border:1px solid #334155;border-radius:16px;padding:14px}
.bar{height:20px;background:#000;border-radius:10px;overflow:hidden}
.fill{height:100%;width:0%;background:#38bdf8}
button{padding:10px;border-radius:8px;border:0;background:#334155;color:#fff;font-weight:600}
button:active{scale:.97}
</style>
</head>
<body>
<h1 style="color:#38bdf8">Find My Phone</h1>
<div id="mainBtn" class="circle"><span style="font-size:30px">🎤</span><span id="mainTxt">ATIVAR</span></div>
<div>Palmas: <b id="cnt">0</b>/5</div>
<div class="card">
<div style="display:flex;justify-content:space-between">Sensibilidade <b id="sVal">20</b></div>
<input id="sRange" type="range" min="10" max="90" value="20" style="width:100%">
<div>Nível: <span id="lvl">0</span>/100</div>
<div class="bar"><div id="fill" class="fill"></div></div>
<div id="msg" style="text-align:center;color:#38bdf8;margin:8px 0">Parado</
